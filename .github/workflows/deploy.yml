# Auto-deploy to tonytechlab production server on push to main.
#
# Triggers only when app sources change — doc-only edits skip the build.
# The workflow SSHs to the server and runs the shared /opt/tonytechlab/deploy.sh
# script which handles git pull, rebuild, and post-deploy health check.
#
# Secrets required on this repo:
#   DEPLOY_HOST      server IP/hostname
#   DEPLOY_USER      SSH user (root)
#   DEPLOY_SSH_KEY   ed25519 private key authorized on the server

name: Deploy to production

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "prisma/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "tailwind.config.ts"
      - "docker-compose.yml"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # StrictHostKeyChecking=accept-new trusts on first connect and pins
          # after — handles the case where ssh-keyscan is flaky from runners.
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Run deploy script
        run: ssh deploy-target "/opt/tonytechlab/deploy.sh clm clm"
